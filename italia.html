<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Italia | Genealogía Fioravante</title>
<meta name="theme-color" content="#0C211D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink-900:#0C211D;--leaf:#6FD6AE;--leaf-deep:#1F7A60;--honey:#F0C27A;--honey-soft:#EBD3A4;--honey-deep:#A8731F;--paper:#F6F2E8;--mist:#9DB5AB;--text-dark:#10231E;--muted-dark:#5E6E67;--line-paper:#E4DDCC;--male-ink:#2D6DB5;--female-ink:#B63A72;--ref:#E58BB4;--danger:#B3372B;--font-display:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;--font-main:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ease-out:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--honey);outline-offset:3px}
html,body{height:100%}
body{background:var(--ink-900);color:var(--paper);font-family:var(--font-main);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage-bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(90% 80% at 50% 40%,rgba(27,68,57,.8),transparent 70%),linear-gradient(160deg,#0F2B25,#0A1B18)}
.aurora{position:absolute;border-radius:50%;will-change:transform}
.a1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(47,160,125,.24),transparent 65%);animation:drift-a 28s ease-in-out infinite alternate}
.a2{width:60vmax;height:60vmax;right:-20vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(240,194,123,.12),transparent 65%);animation:drift-b 34s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift-b{to{transform:translate(-7vmax,-5vmax) scale(1.12)}}
@keyframes sheet-in{from{opacity:0;transform:translateY(16px) scale(.985)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:372px minmax(0,1fr);gap:14px;height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:28px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:sheet-in .8s var(--ease-out) backwards}
.side-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;padding:1.3rem 1.3rem .9rem}
.brand h1{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:400;font-size:2.3rem;line-height:1.05;letter-spacing:-.01em}
.brand h1 .ic{width:26px;height:26px;color:var(--leaf)}
.brand p{margin-top:.2rem;font-family:var(--font-display);font-style:italic;font-size:1.15rem;line-height:1.15;color:var(--honey-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.55rem 1.05rem;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--paper);font-weight:600;font-size:.85rem;white-space:nowrap;transition:background .25s,border-color .25s,color .25s,transform .35s var(--ease-out),box-shadow .35s var(--ease-out)}
.btn:hover{background:rgba(255,255,255,.13);color:var(--honey);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-honey,.btn-honey:hover{border:0;background:linear-gradient(145deg,var(--honey),#E2A95A);color:var(--ink-900)}
.btn-honey:hover{box-shadow:0 12px 24px -10px rgba(240,194,123,.6)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;padding:0 1.3rem}
.st{padding:.65rem .8rem .7rem;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}
.st b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1;letter-spacing:-.02em}
.st span{display:block;margin-top:.15rem;color:var(--mist);font-size:.72rem;font-weight:600}
.tools{display:flex;flex-direction:column;gap:.7rem;padding:1rem 1.3rem .8rem}
.search{position:relative}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mist);pointer-events:none}
.search input{width:100%;height:46px;padding:0 16px 0 44px;border-radius:999px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:var(--paper);font-size:.95rem;transition:border-color .25s,box-shadow .25s}
.search input::placeholder{color:var(--mist)}
.search input:focus{outline:none;border-color:var(--honey);box-shadow:0 0 0 4px rgba(240,194,123,.14)}
.note{color:var(--mist);font-size:.76rem;line-height:1.4}
.seg{display:inline-flex;align-self:flex-start;padding:3px;border-radius:999px;background:rgba(255,255,255,.07)}
.seg button{padding:.32rem .85rem;border-radius:999px;color:var(--mist);font-size:.78rem;font-weight:600;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:var(--honey);color:var(--ink-900)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:.2rem 1rem 1.1rem 1.3rem;margin-right:.3rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.city{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.7rem .95rem 1rem;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);transition:background .25s,border-color .25s}
.city:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}
.city.on{background:rgba(240,194,123,.11);border-color:rgba(240,194,123,.5)}
.city .pin{color:var(--leaf)}
.city.on .pin{color:var(--honey)}
.ct strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem;font-weight:600}
.ct small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mist);font-size:.76rem}
.num{font-family:var(--font-display);font-size:1.5rem;line-height:1;color:var(--honey-soft)}
.bar{position:absolute;left:.95rem;right:.95rem;bottom:.45rem;height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar::after{content:'';display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,var(--leaf-deep),var(--leaf))}
.empty{padding:1.6rem 1rem;text-align:center;font-family:var(--font-display);font-style:italic;font-size:1.3rem;color:var(--mist)}
.stage{position:relative;min-width:0;overflow:hidden;border-radius:28px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08),0 0 90px -30px rgba(111,214,174,.35);animation:sheet-in .8s var(--ease-out) .1s backwards}
#map{position:absolute;left:0;top:0;width:calc(100% - var(--mr,0px));height:calc(100% - var(--mb,0px));border:0;z-index:0;background:#0F1B19}
.stage.po{--mr:428px}
.mapbar{position:absolute;z-index:450;top:14px;right:calc(14px + var(--mr,0px));display:flex;gap:.5rem}
.fab{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:44px;padding:0 1.05rem;border-radius:999px;background:rgba(12,33,29,.86);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--paper);font-weight:600;font-size:.85rem;box-shadow:0 12px 26px -12px rgba(0,0,0,.7);transition:color .25s,border-color .25s,transform .35s var(--ease-out)}
.fab:hover{color:var(--honey);border-color:rgba(240,194,123,.5);transform:translateY(-2px)}
.fab.menu{display:none;width:44px;padding:0}
.hud{position:absolute;z-index:450;left:14px;bottom:44px;transition:opacity .3s}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:min(78vw,360px);padding:.4rem .95rem .4rem .8rem;border-radius:999px;background:rgba(12,33,29,.86);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--mist);font-size:.8rem;font-weight:500}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--leaf)}
.status-dot.warn{background:var(--honey);animation:hint-pulse 2.2s ease-out infinite}
.status-dot.err{background:#FF9A90}
@keyframes hint-pulse{0%{box-shadow:0 0 0 0 rgba(240,194,123,.5)}100%{box-shadow:0 0 0 10px rgba(240,194,123,0)}}
.panel{position:absolute;z-index:500;top:14px;right:14px;bottom:44px;width:min(400px,calc(100% - 28px));display:flex;flex-direction:column;border-radius:26px;color:var(--text-dark);background:linear-gradient(180deg,#FBF9F3,#F4EFE3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 40px 80px -20px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateX(calc(100% + 24px));transition:transform .55s var(--ease-out),opacity .3s,visibility 0s .55s}
.panel.on{opacity:1;visibility:visible;transform:none;transition:transform .55s var(--ease-out),opacity .3s}
.panel :focus-visible{outline-color:var(--leaf-deep)}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;padding:1.4rem 1.4rem .9rem}
.p-head h2{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1.05;letter-spacing:-.01em}
.p-head p{margin-top:.2rem;color:var(--muted-dark);font-size:.88rem}
.x{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;border:1.5px solid #D6CEBB;color:var(--text-dark);transition:background .25s,border-color .25s}
.x:hover{background:rgba(31,122,96,.07);border-color:var(--leaf-deep)}
.p-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:1rem 1.4rem 1.4rem}
.prow{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.6rem .8rem;border-radius:16px;background:#fff;border:1px solid var(--line-paper);transition:border-color .25s,background .25s}
.prow:hover{border-color:var(--leaf-deep);background:#FDFCF8}
.pn{flex:1;min-width:0;overflow-wrap:anywhere}
.pn b{display:block;font-weight:600;font-size:.92rem}
.pn small{display:block;color:var(--muted-dark);font-size:.78rem}
.scrim{display:none}
@media (max-width:768px){
.app{display:block;padding:0}
.stage{position:fixed;inset:0;border-radius:0;box-shadow:none}
.side{position:fixed;z-index:700;top:0;bottom:0;left:0;width:min(88vw,380px);border-radius:0 28px 28px 0;background:rgba(10,27,24,.97);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);transform:translateX(-104%);transition:transform .45s var(--ease-out);animation:none}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:650;background:rgba(5,16,13,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.on{display:block}
.mapbar{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
.fab.menu{display:inline-flex}
.hud{left:max(12px,env(safe-area-inset-left));bottom:calc(44px + env(safe-area-inset-bottom))}
.stage{--mb:env(safe-area-inset-bottom)}
.stage.po{--mr:0px;--mb:40dvh}
.stage.po .hud{opacity:0;pointer-events:none}
.panel{top:auto;left:10px;right:10px;bottom:calc(34px + env(safe-area-inset-bottom));width:auto;height:auto;max-height:62dvh;border-radius:26px;transform:translateY(130%)}
.p-head{padding:1.2rem 1.2rem .8rem}
.p-head h2{font-size:1.7rem}
.p-body{padding:.9rem 1.2rem 1.2rem}
}
@media (max-width:520px){.fab span{display:none}.fab{width:44px;padding:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}}

.ctx{padding:1rem 1.1rem;border-radius:18px;background:#EDE6D5;font-size:.95rem;line-height:1.6}
.sec{margin:.8rem 0 .1rem;font-family:var(--font-display);font-weight:400;font-size:1.4rem;line-height:1.1}
.lk{align-items:flex-start;color:inherit}
.lk .ic{margin-top:.15rem;color:var(--leaf-deep)}
.lk .pn small{margin-top:.1rem;line-height:1.4}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<div class="stage-bg" aria-hidden="true"><i class="aurora a1"></i><i class="aurora a2"></i></div>

<div class="app">
  <aside class="side" id="side" aria-label="Núcleos de Italia">
    <header class="side-head">
      <div class="brand">
        <h1><svg class="ic" aria-hidden="true"><use href="#i-tree"/></svg>Italia</h1>
        <p>Dónde se documenta el apellido Fioravante</p>
      </div>
      <a class="btn btn-honey" href="arbol.html" title="Volver al árbol"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>Árbol</span></a>
    </header>
    <div class="stats">
      <div class="st"><b id="stCities">—</b><span>Núcleos</span></div>
      <div class="st"><b id="stRegions">—</b><span>Regiones</span></div>
    </div>
    <div class="tools">
      <div class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="q" placeholder="Buscar ciudad o región" autocomplete="off" aria-label="Buscar ciudad o región"></div>
      <div class="seg" role="group" aria-label="Ordenar núcleos" id="segCity"><button type="button" data-s="name" aria-pressed="true">A–Z</button><button type="button" data-s="region" aria-pressed="false">Por región</button></div>
      <p class="note">Registros demográficos e históricos del apellido en Italia, con enlaces a archivos y mapas.</p>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="stage" id="stage">
    <iframe id="map" title="Mapa de Google" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen"></iframe>
    <div class="mapbar">
      <button class="fab menu" id="menuBtn" type="button" aria-label="Abrir lista de núcleos"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

/* Datos del apellido Fioravante en Italia */
const DATA = [
        { 
            id: "caserta", 
            nombre: "Caserta", 
            region: "Campania", 
            contexto: "Campania es estadísticamente la región con mayor presencia del apellido exacto y singular 'Fioravante' en el sur de Italia, consolidado como un apellido independiente en los registros civiles locales.",
            personajes: [
                { nombre: "Distribución del Apellido Fioravante", descripcion: "Plataforma internacional de heráldica y árboles genealógicos en español que analiza el volumen y dispersión del apellido singular.", url: "https://www.familysearch.org/es/surname?surname=Fioravante" }
            ],
            lugares: [
                { nombre: "Mapa de Densidad: Fioravante en Caserta", descripcion: "Enlace cartográfico configurado en español enfocado en los núcleos familiares registrados con la terminación exacta en 'e'.", url: "https://www.google.com/maps/search/Fioravante,+Caserta,+Italia/?hl=es" }
            ]
        },
        { 
            id: "napoles", 
            nombre: "Nápoles", 
            region: "Campania", 
            contexto: "Históricamente, los registros de migración interna identifican a Nápoles como el punto de documentación e intercambio mercantil de las familias Fioravante originarias de las zonas rurales circundantes.",
            personajes: [
                { nombre: "Archivo Histórico Documental", descripcion: "Análisis etimológico en español sobre la raíz del nombre germánico convertido en apellido (Fioravante) en el Reino de Nápoles.", url: "https://es.wikipedia.org/wiki/Fioravanti#Origen" }
            ],
            lugares: [
                { nombre: "Mapa de Registros: Fioravante en Nápoles", descripcion: "Geolocalización en español de archivos y referencias civiles que contienen de forma explícita el apellido Fioravante.", url: "https://www.google.com/maps/search/Fioravante,+Napoli,+Italia/?hl=es" }
            ]
        },
        { 
            id: "salerno", 
            nombre: "Salerno", 
            region: "Campania", 
            contexto: "Junto con Caserta y Nápoles, la provincia de Salerno consolida el núcleo de mayor densidad histórica del apellido singular Fioravante, frecuentemente registrado en actas de la región costera.",
            personajes: [
                { nombre: "Genealogía de Campania - Salerno", descripcion: "Búsqueda en registros genealógicos (NMD) italianos con un enfoque específico en las provincias del sur.", url: "https://www.familysearch.org/es/search/record/results?q.surname=Fioravante&q.surname.exact=on&q.place=Salerno%2C%20Campania%2C%20Italy" }
            ],
            lugares: [
                { nombre: "Fioravante en la Provincia de Salerno", descripcion: "Mapa demográfico interactivo enfocado en los núcleos familiares del área salernitana.", url: "https://www.google.com/maps/search/Fioravante,+Salerno,+Italia/?hl=es" }
            ]
        },
        { 
            id: "foggia", 
            nombre: "Foggia", 
            region: "Apulia (Puglia)", 
            contexto: "En la región de Apulia, particularmente en la provincia de Foggia, el apellido Fioravante presenta núcleos poblacionales estables con registros históricos que datan de antiguos asentamientos agrícolas y comerciales del sur.",
            personajes: [
                { nombre: "Portal Antenati - Archivos del Estado", descripcion: "Sistema de Archivos de Estado italianos donde figuran las partidas de nacimiento y matrimonio de la familia Fioravante.", url: "https://antenati.cultura.gov.it/?lang=es" }
            ],
            lugares: [
                { nombre: "Mapa de Registros: Fioravante en Foggia", descripcion: "Geolocalización en español de archivos y referencias civiles en la región de Apulia.", url: "https://www.google.com/maps/search/Fioravante,+Foggia,+Italia/?hl=es" }
            ]
        },
        { 
            id: "roma", 
            nombre: "Roma", 
            region: "Lacio (Lazio)", 
            contexto: "Como gran centro administrativo y capital, Roma y la región del Lacio han sido históricamente un foco de migración interna, albergando numerosas ramas de la familia Fioravante en registros parroquiales y notariales.",
            personajes: [
                { nombre: "Censos Históricos y Genealogía (Cognomix)", descripcion: "Mapeo genealógico de las familias asentadas en el centro de Italia que mantienen la terminación singular en 'e'.", url: "https://www.cognomix.it/mappe-dei-cognomi-italiani/FIORAVANTE/LAZIO" }
            ],
            lugares: [
                { nombre: "Mapa de Distribución: Lacio", descripcion: "Filtro cartográfico directo para la búsqueda del término Fioravante en los alrededores de la capital italiana.", url: "https://www.google.com/maps/search/Fioravante,+Roma,+Italia/?hl=es" }
            ]
        },
        { 
            id: "treviso", 
            nombre: "Treviso", 
            region: "Véneto", 
            contexto: "Foco del norte de Italia. En esta zona el apellido coexistió con formas derivadas. A diferencia del sur, aquí aparece estrechamente ligado a topónimos medievales derivados del nombre propio Fioravante.",
            personajes: [
                { nombre: "Evolución Lingüística del Apellido", descripcion: "Explicación del desarrollo filológico en castellano del nombre propio 'Fioravante' hacia su fijación como apellido familiar.", url: "https://es.wikipedia.org/wiki/Fioravanti#Etimolog%C3%ADa" }
            ],
            lugares: [
                { nombre: "Mapa de Ubicación: Treviso", descripcion: "Filtro cartográfico directo en idioma español que destaca las menciones y registros en la provincia de Treviso.", url: "https://www.google.com/maps/search/Fioravante,+Treviso,+Italia/?hl=es" }
            ]
        },
        { 
            id: "vicenza", 
            nombre: "Vicenza", 
            region: "Véneto", 
            contexto: "Comparte con Treviso la historia filológica del norte italiano, documentando menciones y registros asignados al término exacto Fioravante en medio de otras formas derivadas.",
            personajes: [
                { nombre: "Archivos Históricos del Véneto", descripcion: "Registros regionales donde el apellido singular aparece referenciado históricamente.", url: "https://es.wikipedia.org/wiki/Fioravanti#Etimolog%C3%ADa" }
            ],
            lugares: [
                { nombre: "Mapa de Ubicación: Vicenza", descripcion: "Geolocalización en español de archivos y presencia actual en Vicenza.", url: "https://www.google.com/maps/search/Fioravante,+Vicenza,+Italia/?hl=es" }
            ]
        },
        { 
            id: "benevento", 
            nombre: "Benevento", 
            region: "Campania", 
            contexto: "Al estar inmersa en la región con la principal concentración demográfica del apellido, cuenta con una sólida base histórica de actas de estado civil (nacimientos y defunciones) que mantienen la ortografía inalterada en 'e'.",
            personajes: [
                { nombre: "Archivos del Estado - Benevento", descripcion: "Registros históricos oficiales que documentan a los portadores del apellido en la provincia.", url: "https://antenati.cultura.gov.it/?lang=es" }
            ],
            lugares: [
                { nombre: "Fioravante en Benevento", descripcion: "Mapeo geográfico de familias asentadas en esta área de la Campania.", url: "https://www.google.com/maps/search/Fioravante,+Benevento,+Italia/?hl=es" }
            ]
        },
        { 
            id: "avellino", 
            nombre: "Avellino", 
            region: "Campania", 
            contexto: "Zona que documenta el asentamiento rural y desarrollo agrario de las familias sureñas, en cuyos archivos comunales y eclesiásticos ha permanecido registrada la variante 'Fioravante' hasta la actualidad.",
            personajes: [
                { nombre: "Registros Parroquiales y Comunales", descripcion: "Búsqueda en registros genealógicos italianos con foco en la zona de Avellino.", url: "https://www.familysearch.org/es/search/record/results?q.surname=Fioravante&q.place=Avellino%2C%20Italy" }
            ],
            lugares: [
                { nombre: "Mapa Demográfico: Avellino", descripcion: "Localización cartográfica de las referencias territoriales del apellido.", url: "https://www.google.com/maps/search/Fioravante,+Avellino,+Italia/?hl=es" }
            ]
        },
        { 
            id: "bari", 
            nombre: "Bari", 
            region: "Apulia (Puglia)", 
            contexto: "Como puerto y centro urbano clave al sureste, registra la presencia actual e histórica del apellido exacto 'Fioravante' como resultado de los movimientos comerciales y de migración interna conectados directamente con Foggia.",
            personajes: [
                { nombre: "Censos Históricos y Comerciales", descripcion: "Mapeo genealógico de familias asentadas en la región portuaria de Apulia.", url: "https://www.cognomix.it/mappe-dei-cognomi-italiani/FIORAVANTE/PUGLIA" }
            ],
            lugares: [
                { nombre: "Distribución en Bari", descripcion: "Filtro cartográfico para explorar registros del término en la ciudad y provincia de Bari.", url: "https://www.google.com/maps/search/Fioravante,+Bari,+Italia/?hl=es" }
            ]
        }
    ];

const total = c => (c.personajes?.length || 0) + (c.lugares?.length || 0);
const maxCount = Math.max(1, ...DATA.map(total));
let sel = null, cur = null, sortCity = 'name', mapType = store.get('fio_maptype') === 'h' ? 'h' : 'm';

function setStatus(t, type){ $('statusText').textContent = t; $('dot').className = 'status-dot' + (type ? ' ' + type : ''); }

/* Mapa: Google Maps incrustado, sin API ni claves */
const frame = $('map'), TLBL = { m: 'Satélite', h: 'Mapa' };
function setType(t){ mapType = t; $('tilesLbl').textContent = TLBL[t]; store.set('fio_maptype', t); }
function loadMap(){
  const base = 'https://www.google.com/maps?';
  const src = cur ? `${base}q=${encodeURIComponent(`${cur.nombre}, ${cur.region}, Italia`)}&z=11&t=${mapType}&hl=es&output=embed` : `${base}q=Italia&t=${mapType}&hl=es&output=embed`;
  if (src === frame.dataset.src) return;
  frame.dataset.src = src;
  setStatus(cur ? `Buscando ${cur.nombre}…` : 'Cargando mapa…', 'warn');
  frame.src = src;
}
frame.addEventListener('load', () => setStatus(cur ? cur.nombre : 'Italia'));

/* Lista */
function renderList(){
  const q = norm($('q').value);
  const cmp = (a, b) => a.nombre.localeCompare(b.nombre, 'es');
  const arr = DATA.filter(c => !q || norm(c.nombre + ' ' + c.region).includes(q)).sort(sortCity === 'region' ? (a, b) => a.region.localeCompare(b.region, 'es') || cmp(a, b) : cmp);
  $('list').innerHTML = arr.length ? arr.map(c => `<button type="button" class="city${c.id === sel ? ' on' : ''}" data-id="${esc(c.id)}" style="--w:${Math.round(total(c) / maxCount * 100)}%"><svg class="ic pin" aria-hidden="true"><use href="#i-pin"/></svg><span class="ct"><strong>${esc(c.nombre)}</strong><small>${esc(c.region)}</small></span><span class="num" title="${plural(total(c), 'referencia', 'referencias')}">${total(c)}</span><i class="bar"></i></button>`).join('')
    : '<p class="empty">Ningún núcleo coincide con la búsqueda.</p>';
}

/* Selección y ficha */
const section = (title, items) => items?.length ? `<h3 class="sec">${title}</h3>` + items.map(i => `<a class="prow lk" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer"><span class="pn"><b>${esc(i.nombre)}</b><small>${esc(i.descripcion)}</small></span><svg class="ic" aria-hidden="true"><use href="#i-ext"/></svg></a>`).join('') : '';
function select(id){
  const c = DATA.find(x => x.id === id); if (!c) return;
  sel = id; cur = c;
  document.querySelectorAll('.city').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  $('pTitle').textContent = c.nombre;
  $('pSub').textContent = `${c.region}, ${plural(total(c), 'referencia', 'referencias')}`;
  $('pBody').innerHTML = `<div class="ctx">${esc(c.contexto)}</div>` + section('Archivos y genealogía', c.personajes) + section('Mapas del apellido', c.lugares);
  $('pBody').scrollTop = 0;
  $('panel').classList.add('on'); $('panel').setAttribute('aria-hidden', 'false');
  $('stage').classList.add('po');
  loadMap(); closeDrawer();
}
function closePanel(){
  $('panel').classList.remove('on'); $('panel').setAttribute('aria-hidden', 'true');
  $('stage').classList.remove('po');
  sel = null;
  document.querySelectorAll('.city.on').forEach(b => b.classList.remove('on'));
}
const closeDrawer = () => { $('side').classList.remove('open'); $('scrim').classList.remove('on'); };
const openDrawer = () => { $('side').classList.add('open'); $('scrim').classList.add('on'); };
function resetView(){ $('q').value = ''; renderList(); closePanel(); closeDrawer(); cur = null; loadMap(); }

/* Eventos */
let deb;
$('q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(renderList, 220); });
$('segCity').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  $('segCity').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  sortCity = b.dataset.s; renderList();
});
$('list').addEventListener('click', e => { const b = e.target.closest('.city'); if (b) select(b.dataset.id); });
$('resetBtn').addEventListener('click', resetView);
$('tilesBtn').addEventListener('click', () => { setType(mapType === 'm' ? 'h' : 'm'); loadMap(); });
$('pClose').addEventListener('click', closePanel);
$('menuBtn').addEventListener('click', () => $('side').classList.contains('open') ? closeDrawer() : openDrawer());
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('side').classList.contains('open')) closeDrawer(); else if ($('panel').classList.contains('on')) closePanel();
});

/* Inicio */
$('stCities').textContent = DATA.length;
$('stRegions').textContent = new Set(DATA.map(c => c.region)).size;
setType(mapType); renderList(); loadMap();
</script>
</body>
</html>
